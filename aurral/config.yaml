name: Aurral
# renovate: image=ghcr.io/lklynet/aurral
version: "2.10.0.0"
slug: aurral
description: Music discovery, playlists and a Subsonic server, alongside Lidarr
url: "https://github.com/paalwilliams/homeassistant-addons"
arch:
  - amd64
  - aarch64
init: false
boot: auto
map:
  - addon_config:rw
  - media:rw
  - share:rw
ports:
  3001/tcp: null
ports_description:
  3001/tcp: Web interface and Subsonic API (not needed behind a reverse proxy)
webui: http://[HOST]:[PORT:3001]
options:
  PUID: 0
  PGID: 0
  TZ: UTC
  env_vars: []
schema:
  PUID: int
  PGID: int
  TZ: str
  env_vars:
    - name: str
      value: str?
