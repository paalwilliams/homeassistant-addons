# wger is served by gunicorn, which does not serve /static/ or /media/ itself
# when DJANGO_DEBUG is False. Upstream puts nginx in front of it for exactly
# this reason, so we bundle a minimal version of that config here.
server {
    listen 8000;

    access_log /dev/stdout;

    # Allow video uploads
    client_max_body_size 100M;

    location /static/ {
        alias /home/wger/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
    }

    location /media/ {
        alias /data/wger/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
